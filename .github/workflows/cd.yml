name: CD

# 两件事：
#   1. push 到 main → 构建两个镜像并推到 GHCR（:latest 与 :sha-<commit>）；
#   2. 手动触发并勾选 deploy → 再通过 SSH 让服务器拉新镜像重启。
# 服务器只 pull 不 build，所以 1GB 机型也能用（构建要 1GB 上下内存，见 DEPLOY.md 2.1）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 同时部署到服务器（需先配置 DEPLOY_* secrets，见 DEPLOY.md 第 10 节）
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: 构建并推送镜像（GHCR）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: deploy/Dockerfile.backend
          - name: frontend
            dockerfile: deploy/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像前缀（GHCR 只接受小写）
        id: meta
        run: |
          prefix="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "镜像前缀：$prefix （服务器 .env 里的 GHCR_PREFIX 就填这个）"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 ${{ matrix.name }} 镜像
        # 刻意与推送分开两步：build-push-action 一步做完时，失败消息里分不清
        # 是"构建挂了"还是"推不上去"（第一次跑就是这么卡住的）。
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:latest
            ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 推送到 GHCR
        run: |
          docker push ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:latest
          docker push ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:sha-${{ github.sha }}

      - name: 失败时打印诊断信息
        if: failure()
        run: |
          echo "── 镜像是否构建出来了 ──"
          docker images | grep -i volunteer || echo "（没有产出镜像 → 失败在构建阶段）"
          echo "── 登录状态 ──"
          docker info 2>/dev/null | grep -i "registry\|username" || true
          echo "── 提示 ──"
          echo "若失败在「推送到 GHCR」：检查仓库 Settings → Actions → General → Workflow permissions"
          echo "是否允许 read and write（详见 DEPLOY.md 第 10 节）。"

  deploy:
    name: 部署到服务器（手动触发）
    needs: images
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: 检查 secrets 是否配齐
        run: |
          missing=""
          [ -n "${{ secrets.DEPLOY_HOST }}" ] || missing="$missing DEPLOY_HOST"
          [ -n "${{ secrets.DEPLOY_USER }}" ] || missing="$missing DEPLOY_USER"
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "${{ secrets.DEPLOY_PATH }}" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "缺少 secrets：$missing"
            echo "配置位置：仓库 Settings → Secrets and variables → Actions，见 DEPLOY.md 第 10.2 节"
            exit 1
          fi

      - name: 写入 SSH 私钥并信任主机指纹
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 服务器上拉取新镜像并重启
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.yml -f deploy/compose.ghcr.yml pull
            docker compose -f docker-compose.yml -f deploy/compose.ghcr.yml up -d
            docker compose ps
          '

# ════════════════════════════════════════════════════════════════
# 公网演示站点配置（nginx）
#
# 三件事必须由它来做，否则项目"能跑但没法看"：
#   1. 托管前端产物 + try_files 兜底 —— 前端用 createWebHistory，
#      纯 Spring Boot 部署下刷新 /admin/xxx 这类深链会 404；
#   2. 反代 /api 与 /files 到后端（前端 request.js 的 baseURL 是空的，
#      要求同源，所以必须由 nginx 把两个路径转给 8081）；
#   3. HTTPS —— 志愿者的扫码签到依赖浏览器 getUserMedia，
#      它只在安全上下文（HTTPS/localhost）可用，纯 http 下摄像头调不起来。
# ════════════════════════════════════════════════════════════════

upstream volunteer_backend {
    server backend:8081;
    keepalive 16;
}

# ---------- HTTP：只留 ACME 挑战，其余全部跳 HTTPS ----------
server {
    listen 80;
    server_name _;

    # certbot 续期用的挑战目录（webroot 模式；standalone 模式可忽略）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 与后端 multipart 限额保持一致（application-prod.yml 的 UPLOAD_MAX_REQUEST）
    client_max_body_size 4m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 接口：转给后端 ----
    location /api/ {
        proxy_pass http://volunteer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---- 上传的文件（头像/活动图/商品图）----
    location /files/ {
        proxy_pass http://volunteer_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 静态资源：带指纹的产物可以长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 其余路径：先找文件，找不到就交给前端路由（SPA 深链兜底）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 本身不要缓存，否则前端发版后用户拿到旧壳
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

server:
  # 应用服务端口
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  datasource:
    # 数据库驱动：MySQL 8.x 建议使用 com.mysql.cj.jdbc.Driver
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接 URL：包含时区设置(GMT+8)和字符编码(UTF-8)
    # 注意：127.0.0.1 比 localhost 在某些环境下解析更稳定
    # 主机/端口/库名均可通过环境变量覆盖，默认值仅面向本地开发
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:volunteer_db}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件最大限制
      max-request-size: 10MB   # 单次请求总大小限制

# JWT 配置
# 生产环境必须通过环境变量 JWT_SECRET 覆盖默认的开发密钥：
#   源码泄漏的密钥等于让攻击者可以离线伪造任意角色的 Token，绕过全部鉴权。
jwt:
  secret: ${JWT_SECRET:volunteer-system-secret-key-2026-secure-jwt-key}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

mybatis-plus:
  configuration:
    # 开启驼峰命名转换：自动将数据库表字段 user_id 映射到 Java 实体类属性 userId
    map-underscore-to-camel-case: true
    # SQL 日志打印：在控制台输出执行的原始 SQL 语句，开发环境必备，生产环境建议关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志管理配置
logging:
  level:
    # 全局日志级别（控制三方库日志量）
    root: INFO
    # 本地业务代码日志级别：设置为 DEBUG 方便观察 SQL 执行和业务逻辑流转
    com.volunteer.system: DEBUG

# Knife4j / Swagger 接口文档配置
springdoc:
  api-docs:
    # 是否开启 OpenAPI 接口元数据
    enabled: true
  # 扫描范围：只扫描本项目包下的注解，避免混入三方库接口
  packages-to-scan: com.volunteer.system
  swagger-ui:
    # 原生 Swagger UI 路径 (访问地址: /swagger-ui.html)
    # 注意：集成 Knife4j 后，通常访问 /doc.html 体验更好
    path: /swagger-ui.html
    tags-sorter: alpha       # 将左侧的标签（Controller模块）按字母数字顺序排序
    operations-sorter: alpha # 将模块内部的具体接口也按字母顺序排序（可选）
